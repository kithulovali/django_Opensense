{% extends 'base.html' %}
{% block content %}
<h3>Face Enrollment</h3>
<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Upload & Encode</button>
</form>
{% if profile and profile.image %}
<div class="mt-4">
  <h5>Current Image</h5>
  <img src="{{ profile.image.url }}" class="img-fluid" style="max-width:300px;" />
</div>
{% endif %}
{% endblock %}
